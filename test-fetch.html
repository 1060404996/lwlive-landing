<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>fetch 测试</title></head>
<body style="font-family:monospace;padding:20px;font-size:14px">
<pre id="o">loading...</pre>
<script>
(async function(){
  var urls = [
    'https://img.yjtv.top/file/1791818873896_livehub-0.5.18_24.ipa',
    'https://img.yjtv.top/file/%E8%BD%AF%E4%BB%B6/1791820312664_livehub-0.518_24.apk'
  ];
  var s = '';
  for (var i=0;i<urls.length;i++){
    var u = urls[i];
    try{
      var r = await fetch(u, {method:'HEAD', mode:'cors'});
      s += (i+1) + '. ' + u.slice(0,45) + ' => status=' + r.status + ' etag=' + (r.headers.get('etag') || 'null') + '\n';
    }catch(e){
      s += (i+1) + '. ' + u.slice(0,45) + ' => ERROR ' + String(e).slice(0,140) + '\n';
    }
  }
  document.getElementById('o').textContent = s;
})();
</script>
</body>
</html>
